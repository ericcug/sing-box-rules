name: Compile and Release Rules

on:
  push:
    paths:
      - '**/*.txt'
      - 'compile.sh'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install sing-box
      run: |
        LATEST_TAG=$(curl -sSL "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | jq -r .tag_name)
        VERSION="${LATEST_TAG#v}"
        echo "Installing sing-box ${LATEST_TAG}..."
        curl -sSL "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/sing-box-${VERSION}-linux-amd64.tar.gz" | sudo tar -xz --strip-components=1 -C /usr/local/bin "sing-box-${VERSION}-linux-amd64/sing-box"
        sing-box version

    - name: Fetch upstream rules and dnsmasq configs
      run: |
        # Download upstream sources in parallel
        curl -sSL https://anti-ad.net/domains.txt -o anti_ad_domains.txt &
        curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf -o accelerated-domains.china.conf &
        curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf -o apple.china.conf &
        curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf -o google.china.conf &
        curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/bogus-nxdomain.china.conf -o bogus-nxdomain.china.conf &
        wait

        # Replace default 114.114.114.114 with 202.103.224.68 in dnsmasq configs
        sed -i 's/114\.114\.114\.114/202.103.224.68/g' accelerated-domains.china.conf apple.china.conf google.china.conf

        # Generate merged dnsmasq.conf for dnsmasq direct loading
        cat accelerated-domains.china.conf apple.china.conf google.china.conf bogus-nxdomain.china.conf > dnsmasq.conf

        # Extract domains for sing-box rule-set compilation
        sed -E 's|^server=/(.*)/[0-9.]+$|\1|' accelerated-domains.china.conf | grep -Ev -e '^#' -e '^$' > accelerated-domains.china.txt
        sed -E 's|^server=/(.*)/[0-9.]+$|\1|' apple.china.conf | grep -Ev -e '^#' -e '^$' > apple.china.txt
        sed -E 's|^server=/(.*)/[0-9.]+$|\1|' google.china.conf | grep -Ev -e '^#' -e '^$' > google.china.txt

    - name: Compile rule sets
      run: |
        chmod +x ./compile.sh
        ./compile.sh

    - name: Publish Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="latest"
        TITLE="Latest Rules ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
        NOTES="Automatically compiled sing-box rule sets and dnsmasq configurations. Updated at $(date -u +'%Y-%m-%d %H:%M:%S UTC')."

        # Delete old releases if any to retain only the latest release
        for old_tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true); do
          echo "Deleting old release: $old_tag"
          gh release delete "$old_tag" --yes --cleanup-tag || true
        done

        # Create latest release
        gh release create "$TAG" \
          --title "$TITLE" \
          --notes "$NOTES" \
          *.srs dnsmasq.conf accelerated-domains.china.conf apple.china.conf google.china.conf bogus-nxdomain.china.conf